<!DOCTYPE html>
<html>
<head>

    <title>Contact Royal Hotel</title>

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{

            background:
            linear-gradient(rgba(0,0,0,0.7),
            rgba(0,0,0,0.7)),

            url('https://images.unsplash.com/photo-1522798514-97ceb8c4f1c8?q=80&w=1400');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            color:white;
        }

        /* Navbar */

        header{

            background:rgba(0,0,0,0.7);

            padding:18px;

            position:sticky;
            top:0;

            backdrop-filter:blur(5px);
        }

        nav{
            display:flex;
            justify-content:center;
            gap:25px;
        }

        nav a{

            color:white;

            text-decoration:none;

            font-size:18px;

            transition:0.4s;
        }

        nav a:hover{
            color:orange;
            transform:scale(1.1);
        }

        /* Main Section */

        .container{

            width:85%;

            margin:60px auto;

            display:flex;

            justify-content:center;
        }

        /* Contact Box */

        .contact-box{

            width:500px;

            background:rgba(255,255,255,0.1);

            padding:40px;

            border-radius:20px;

            backdrop-filter:blur(8px);

            box-shadow:0 0 20px rgba(0,0,0,0.5);

            animation:fade 2s;
        }

        .contact-box h1{

            text-align:center;

            margin-bottom:30px;

            color:orange;

            font-size:45px;
        }

        /* Form */

        form{
            display:flex;
            flex-direction:column;
            gap:18px;
        }

        input, textarea{

            padding:14px;

            border:none;

            border-radius:8px;

            outline:none;

            font-size:16px;
        }

        textarea{
            resize:none;
        }

        button{

            background:orange;

            color:white;

            padding:14px;

            border:none;

            border-radius:8px;

            font-size:18px;

            cursor:pointer;

            transition:0.4s;
        }

        button:hover{

            background:white;

            color:black;

            transform:scale(1.05);
        }

        /* Contact Info */

        .info{

            margin-top:25px;

            text-align:center;

            line-height:2;
        }

        .info h3{
            color:orange;
        }

        /* Animation */

        @keyframes fade{

            from{
                opacity:0;
                transform:translateY(50px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* Footer */

        footer{

            background:rgba(0,0,0,0.7);

            color:white;

            text-align:center;

            padding:18px;

            margin-top:40px;
        }

        /* Responsive */

        @media(max-width:768px){

            nav{
                flex-direction:column;
                align-items:center;
            }

            .contact-box{
                width:100%;
                padding:25px;
            }

            .contact-box h1{
                font-size:35px;
            }
        }

    </style>

</head>

<body>

<header>

    <nav>

        <a href="index.html">Home</a>
        <a href="rooms.html">Rooms</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>

    </nav>

</header>

<div class="container">

    <div class="contact-box">

        <h1>Contact Us</h1>

        <form>

            <input type="text"
            placeholder="Enter Your Name">

            <input type="email"
            placeholder="Enter Your Email">

            <textarea rows="5"
            placeholder="Your Message"></textarea>

            <button type="submit">

                Send Message

            </button>

        </form>

        <!-- Contact Info -->

        <div class="info">

            <h3>Royal Hotel</h3>

            <p>📍 Karachi, Pakistan</p>

            <p>📞 +92 300 1234567</p>

            <p>✉ royalhotel@gmail.com</p>

        </div>

    </div>

</div>

<footer>

    <p>

        Designed By Royal Hotel

    </p>

</footer>

</body>
</html>
